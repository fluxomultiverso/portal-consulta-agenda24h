name: Publicar portal no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Construir portal
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_COMPARECIMENTO_HABILITADO: ${{ vars.VITE_COMPARECIMENTO_HABILITADO }}
          VITE_COMPARECIMENTO_WEBHOOK_URL: ${{ vars.VITE_COMPARECIMENTO_WEBHOOK_URL }}
          VITE_GESTAO_HABILITADA: ${{ vars.VITE_GESTAO_HABILITADA }}
          VITE_GESTAO_WEBHOOK_URL: ${{ vars.VITE_GESTAO_WEBHOOK_URL }}

      - name: Preparar rotas diretas
        shell: bash
        run: cp dist/index.html dist/404.html

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar site gerado
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
